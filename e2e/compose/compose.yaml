services:
  # File storage on a named volume, not memory: phase 2 stops and restarts
  # this container and the stream must survive it (ADR-011 r2). -m serves
  # the monitor endpoint the healthcheck reads.
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8222/healthz"]
      interval: 1s
      retries: 30

  retrosampler-1:
    image: retrosampler-e2e:local
    command: ["--config", "/etc/collector/config.yaml"]
    environment:
      - OUTPUT_PATH=/out/traces.json
    volumes:
      - ./config.yaml:/etc/collector/config.yaml:ro
      - ./out/1:/out
    ports:
      - "43181:4317"
    depends_on:
      nats:
        condition: service_healthy

  retrosampler-2:
    image: retrosampler-e2e:local
    command: ["--config", "/etc/collector/config.yaml"]
    environment:
      - OUTPUT_PATH=/out/traces.json
    volumes:
      - ./config.yaml:/etc/collector/config.yaml:ro
      - ./out/2:/out
    ports:
      - "43182:4317"
    depends_on:
      nats:
        condition: service_healthy

  # One image, no command: every phase's flags come from the script's
  # compose run, so the load parameters live next to the asserts that
  # depend on them.
  loadgen:
    image: retrosampler-e2e-loadgen:local
    profiles: [load]

volumes:
  nats-data:
