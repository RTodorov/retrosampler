receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  retrosampler:

exporters:
  file:
    path: ${env:OUTPUT_PATH}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [retrosampler]
      exporters: [file]
  telemetry:
    metrics:
      level: none
