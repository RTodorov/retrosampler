receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:43170

processors:
  retrosampler:
    storage_dir: /tmp/retrosampler-buffer
    disk_budget: 2147483648
    # Pinned: the shard count defaults to GOMAXPROCS, and shards x
    # segment_size must stay under the disk_budget watermark.
    shards: 4
    span_latency_threshold: 500ms
    policies:
      - name: e2e-attr
        condition: 'span.attributes["e2e.keep"] == "yes"'

exporters:
  file:
    path: e2e/out/traces.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [retrosampler]
      exporters: [file]
  telemetry:
    metrics:
      level: none
